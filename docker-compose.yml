services:
  db:
    image: postgres:17-alpine
    container_name: barber-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barber}
      POSTGRES_DB: ${POSTGRES_DB:-barber}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - barber-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barber}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  barber-db-data:
